services:
  dashboard:
    build: .
    image: o2c-dashboard:latest
    ports:
      - "8501:8501"
    volumes:
      # Persist reconciliation output and reports across container restarts
      # so a "re-run pipeline" click in the dashboard survives a redeploy.
      - ./data/processed:/app/data/processed
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
