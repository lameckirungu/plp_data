name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test-quality-gate:
    name: Lint, test, and data-quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hackathon
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/ app/

      - name: Regenerate synthetic source data (determinism check)
        run: python scripts/generate_synthetic_data.py

      - name: Unit + integration tests
        run: pytest -v

      - name: Run pipeline (data-quality gate must pass)
        run: python -m o2c_pipeline.pipeline

      - name: Upload reconciliation report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: o2c-reconciliation-report
          path: |
            hackathon/reports/leakage_summary.json
            hackathon/reports/leakage_analysis.png
            hackathon/reports/pipeline_run_log.json
            hackathon/data/processed/reconciled_order_to_cash.csv
            hackathon/data/processed/data_quality_issues.csv

  docker-build:
    name: Build dashboard container image
    runs-on: ubuntu-latest
    needs: lint-test-quality-gate
    defaults:
      run:
        working-directory: hackathon
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t o2c-dashboard:ci .

      - name: Smoke-test the image starts and serves
        run: |
          docker run -d --name o2c-smoke -p 8501:8501 o2c-dashboard:ci
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8501/_stcore/health; then
              echo "Dashboard healthy"; exit 0
            fi
            sleep 2
          done
          echo "Dashboard failed health check"; docker logs o2c-smoke; exit 1
