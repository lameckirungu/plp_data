name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test-quality-gate:
    name: Lint, test, and data-quality gate (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hackathon
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/ api/

      - name: Regenerate synthetic source data (determinism check)
        run: python scripts/generate_synthetic_data.py

      - name: Unit + integration tests (pipeline + API)
        run: pytest -v

      - name: Run pipeline (data-quality gate must pass)
        run: python -m o2c_pipeline.pipeline

      - name: Upload reconciliation report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: o2c-reconciliation-report
          path: |
            hackathon/reports/leakage_summary.json
            hackathon/reports/leakage_analysis.png
            hackathon/reports/pipeline_run_log.json
            hackathon/data/processed/reconciled_order_to_cash.csv
            hackathon/data/processed/data_quality_issues.csv

  frontend-build-lint:
    name: Type-check, lint, and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hackathon/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: hackathon/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check + build
        run: npm run build

  docker-build:
    name: Build + smoke-test the full container image
    runs-on: ubuntu-latest
    needs: [lint-test-quality-gate, frontend-build-lint]
    defaults:
      run:
        working-directory: hackathon
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t o2c-dashboard:ci .

      - name: Smoke-test the image starts and serves
        run: |
          docker run -d --name o2c-smoke -p 8000:8000 o2c-dashboard:ci
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/api/health; then
              echo "API healthy"; break
            fi
            sleep 2
          done
          curl -fs http://localhost:8000/api/health || { echo "API failed health check"; docker logs o2c-smoke; exit 1; }
          curl -fs http://localhost:8000/ -o /dev/null || { echo "Frontend not served"; docker logs o2c-smoke; exit 1; }
          echo "Container healthy and serving both API and frontend"
