[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o2c-pipeline"
version = "0.1.0"
description = "KPC order-to-cash leakage reconciliation pipeline (Inuka Hackathon, Problem 7D)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pandera>=0.19",
    "matplotlib>=3.7",
    "streamlit>=1.38",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "faker>=25.0", "fpdf2>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
